name: Bug report
description: Report reproducible incorrect behavior using non-sensitive sample text
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        Never include private translation content, vault files, or secret keys. Use synthetic text and the private security form for vulnerabilities.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: v0.1.0
    validations:
      required: true
  - type: dropdown
    id: profile
    attributes:
      label: Profile
      options:
        - Lite
        - Quality
        - Demo/development
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version and CPU
      placeholder: Windows 11 24H2, Intel Core i5-1235U
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use synthetic text only.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed private text, vault files, credentials, and personal information.
          required: true

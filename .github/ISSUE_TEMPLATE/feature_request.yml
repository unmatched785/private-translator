name: Feature request
description: Propose a focused improvement that preserves the offline privacy boundary
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: Privacy and offline impact
      description: Explain any new network, storage, model, or logging behavior.
    validations:
      required: true
